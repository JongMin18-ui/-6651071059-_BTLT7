<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Calculator</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<input type="text" id="num1" value="12">

<button class="operator" data-op="+">+</button>
<button class="operator" data-op="-">-</button>
<button class="operator" data-op="*">×</button>
<button class="operator" data-op="/">/</button>
<button class="operator" data-op="^">^</button>

<input type="text" id="num2" value="14">

<button id="equal">=</button>

<input type="text" id="result">

<script>
var operator = "";

$(".operator").click(function() {
    operator = $(this).data("op");
});

$("#equal").click(function() {

    var a = parseFloat($("#num1").val());
    var b = parseFloat($("#num2").val());
    var result;

    if (operator == "+")
        result = a + b;
    else if (operator == "-")
        result = a - b;
    else if (operator == "*")
        result = a * b;
    else if (operator == "/")
        result = a / b;
    else if (operator == "^")
        result = Math.pow(a, b);

    $("#result").val(result);
});
</script>

</body>
</html>
