<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 30px;
        }
    </style>
    <title>Count and display items of a dropdown list - w3resource</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<form>

Select your favorite Color :

<select id="mySelect">
    <option>Red</option>
    <option>Green</option>
    <option>Blue</option>
    <option>White</option>
</select>

<input type="button"
       onclick="getOptions()"
       value="Count and Output all items">

</form>

<script>
function getOptions() {

    var count = $("#mySelect option").length;
    var items = "";

    $("#mySelect option").each(function () {
        items += $(this).text() + "\n";
    });

    alert("Số lượng: " + count + "\n" + items);
}
</script>

</body>
</html>
